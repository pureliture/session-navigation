name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paseo-plugin/package-lock.json
      - run: npm ci
        working-directory: paseo-plugin
      - run: npm run build
        working-directory: paseo-plugin
      - run: git diff --exit-code -- paseo-plugin/server/worker-source.ts

  vendor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/sync_hermes_vendor.py --check
