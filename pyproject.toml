[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-navigation"
version = "0.1.0"
description = "Host-neutral tool result summarization and compaction engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Session Navigation Contributors" }
]
keywords = ["llm", "context", "compaction", "summarization", "cache", "token-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cachetools>=5.5,<8",
]

[project.scripts]
session-navigation-daemon = "session_navigation_omp.daemon:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "jsonschema>=4.26.0",
    "wheel",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "jsonschema>=4.26.0",
    "wheel",
]

[tool.hatch.build.targets.wheel]
packages = ["src/session_navigation"]

# The wheel ships ``adapters/hermes`` under the ``session_navigation_hermes`` import
# name so a bare ``hermes`` package never shadows another provider's package.

# Editable installs cannot rewrite a package prefix (editables issue #20), so
# the local dev environment binds the source directories under their real names.
# ``uv sync --frozen`` therefore installs this project NON-editable.
[tool.hatch.build.targets.editable]
packages = ["src/session_navigation", "adapters/hermes"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "session_navigation_plugin_root/__init__.py"
"plugin.yaml" = "session_navigation_plugin_root/plugin.yaml"
"adapters/hermes" = "session_navigation_hermes"
"pi_session_navigation_daemon.py" = "session_navigation_omp/daemon.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
